name: tarot-research-mvp

services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Seoul}
      GENERIC_TIMEZONE: ${TZ:-Asia/Seoul}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${N8N_HOST}
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      NODES_EXCLUDE: "[]"
    expose:
      - "5678"
    volumes:
      - ./:/workspace
      - n8n_data:/home/node/.n8n
    working_dir: /workspace
    command: n8n start
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - n8n
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  n8n_data:
  caddy_data:
  caddy_config:

